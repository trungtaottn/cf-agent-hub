name: R1 checks
on:
  pull_request:
  push:
    branches: [main, cf-agent-hub-r1]
  workflow_dispatch:
    inputs:
      visual_evidence:
        description: Synthetic Phase A screenshot capture only (manual evidence branch)
        required: false
        type: boolean
        default: false
      evidence_round:
        description: Closed evidence verifier round (structural checks only; not acceptance)
        required: true
        type: choice
        default: R1
        options:
          - R1
          - R2
      evidence_path:
        description: Actual committed evidence path for the selected round; leave empty for source checks
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: r1-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    if: github.event_name != 'workflow_dispatch' || inputs.visual_evidence != true || github.ref != 'refs/heads/factory-visual-evidence'
    runs-on: ubuntu-24.04
    # Expanded R2 source + browser gates take ~20 minutes; retain a bounded job
    # budget with orchestration headroom without changing per-test safety limits.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Check exact toolchain
        run: |
          test "$(node -p process.versions.node)" = '24.22.1'
          test "$(npm --version)" = '11.19.1'
      - run: npm ci
      - run: node --test test/governance/release-evidence-dispatch.test.mjs
      - run: npm run build:ui
      - run: npm run check
      - run: npm run check:runtime
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Documentation contracts
        run: |
          python -m pip install --requirement requirements-docs.txt
          python -B scripts/validate_docs.py
          python -B scripts/validate_plans.py
          python -B -m unittest discover -s test/governance -p test_r2_source_status.py -v
          python -B -m unittest discover -s test/docs -p test_validate_plans.py -v
  native-source:
    if: github.event_name != 'workflow_dispatch' || inputs.visual_evidence != true || github.ref != 'refs/heads/factory-visual-evidence'
    # Separate source-only regression avoids consuming the aggregate job budget.
    # Preserve platform custody checks: skips are not native/live acceptance.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Check exact toolchain
        run: |
          test "$(node -p process.versions.node)" = '24.22.1'
          test "$(npm --version)" = '11.19.1'
      - run: npm ci
      - run: node --test test/governance/native-source-ci.test.mjs
      - run: npm run test:native:r2:source
  local-sandbox:
    if: github.event_name != 'workflow_dispatch' || inputs.visual_evidence != true || github.ref != 'refs/heads/factory-visual-evidence'
    # Real local workerd/SQLite/emulated-R2 flow, not protected native acceptance.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Check exact toolchain
        run: |
          test "$(node -p process.versions.node)" = '24.22.1'
          test "$(npm --version)" = '11.19.1'
      - run: npm ci
      - run: node scripts/test-native-r2.mjs --local-sandbox
      - run: npm run test:native:r2:observer-local
  native-build:
    if: github.event_name != 'workflow_dispatch' || inputs.visual_evidence != true || github.ref != 'refs/heads/factory-visual-evidence'
    # Fixed actual artifact: two identical builds + import, never executor/installation.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Check exact toolchain
        run: |
          test "$(node -p process.versions.node)" = '24.22.1'
          test "$(npm --version)" = '11.19.1'
      - run: npm ci
      - run: npm run check:native-host
  native-service:
    if: github.event_name != 'workflow_dispatch' || inputs.visual_evidence != true || github.ref != 'refs/heads/factory-visual-evidence'
    # Fixed local service fixture selection; not installed/native acceptance.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Check exact toolchain
        run: |
          test "$(node -p process.versions.node)" = '24.22.1'
          test "$(npm --version)" = '11.19.1'
      - run: npm ci
      - run: npx --no-install tsc -p tsconfig.native-service.json
      - run: npm run test:native:r2:service-source
      - run: npm run test:native:r2:required-controller
      - run: npm run test:native:r2:service-sources
  dependencies:
    if: github.event_name != 'workflow_dispatch' || inputs.visual_evidence != true || github.ref != 'refs/heads/factory-visual-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm ci
      - name: Installed dependency advisories must be clear
        run: npm audit --audit-level=low
      # Release evidence additionally requires an independently inspected
      # installed/embedded/runtime inventory. npm audit alone does not prove it.
  release-evidence:
    if: github.event_name == 'workflow_dispatch' && inputs.evidence_path != '' && (inputs.visual_evidence != true || github.ref != 'refs/heads/factory-visual-evidence')
    needs: [source, dependencies, native-source, local-sandbox, native-build, native-service]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm ci
      - name: Verify actual evidence without publishing
        shell: bash
        env:
          RELEASE_EVIDENCE_PATH: ${{ inputs.evidence_path }}
          RELEASE_EVIDENCE_ROUND: ${{ inputs.evidence_round }}
        run: |
          case "$RELEASE_EVIDENCE_ROUND" in
            R1|R2) ;;
            *) printf '%s\n' 'Unsupported evidence round' >&2; exit 2 ;;
          esac
          node scripts/verify-release.mjs --round "$RELEASE_EVIDENCE_ROUND" --evidence "$RELEASE_EVIDENCE_PATH"

  factory-visual:
    if: github.event_name == 'workflow_dispatch' && inputs.visual_evidence == true && github.ref == 'refs/heads/factory-visual-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 77ee610c13a61077dc866a66556eafdfcb1d2553
          path: product
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Verify immutable product and copy capture-only driver
        working-directory: product
        env:
          DRIVER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '77ee610c13a61077dc866a66556eafdfcb1d2553'
          test "$(git rev-parse HEAD^{tree})" = '3c6eb659c6ad6d30ddd30bc6b22500d819a6c73a'
          test "$(git -C ../driver rev-parse HEAD)" = "$DRIVER_SHA"
          test "$(node -p process.versions.node)" = '24.22.1'
          test "$(npm --version)" = '11.19.1'
          mkdir -p test/visual
          cp ../driver/test/visual/factory.visual.ts test/visual/factory.visual.ts
          cp ../driver/playwright.visual.config.ts playwright.visual.config.ts
          git diff --exit-code
      - run: npm ci
        working-directory: product
      - run: npm run build:ui
        working-directory: product
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: product
      - name: Capture real synthetic desktop and mobile surfaces
        working-directory: product
        env:
          CFHUB_VISUAL_DRIVER_SHA: ${{ github.sha }}
        run: npx --no-install playwright test --config playwright.visual.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: factory-phase-a-visual-${{ github.sha }}
          path: |
            product/factory-visual-evidence/*.png
            product/factory-visual-evidence/receipt.json
          if-no-files-found: error
          retention-days: 3
