name: R1 checks
on:
  pull_request:
  push:
    branches: [main, cf-agent-hub-r1]
  workflow_dispatch:
    inputs:
      evidence_path:
        description: Actual committed R1 evidence path; leave empty for source checks
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: r1-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    # Expanded R2 source + browser gates take ~20 minutes; retain a bounded job
    # budget with orchestration headroom without changing per-test safety limits.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Check exact toolchain
        run: |
          test "$(node -p process.versions.node)" = '24.22.1'
          test "$(npm --version)" = '11.19.1'
      - run: npm ci
      - run: npm run build:ui
      - run: npm run check
      - run: npm run check:runtime
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Documentation contracts
        run: |
          python -m pip install --requirement requirements-docs.txt
          python -B scripts/validate_docs.py
  native-source:
    # Separate source-only regression avoids consuming the aggregate job budget.
    # Preserve platform custody checks: skips are not native/live acceptance.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Check exact toolchain
        run: |
          test "$(node -p process.versions.node)" = '24.22.1'
          test "$(npm --version)" = '11.19.1'
      - run: npm ci
      - run: node --test test/governance/native-source-ci.test.mjs
      - run: npm run test:native:r2:source
  local-sandbox:
    # Real local workerd/SQLite/emulated-R2 flow, not protected native acceptance.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Check exact toolchain
        run: |
          test "$(node -p process.versions.node)" = '24.22.1'
          test "$(npm --version)" = '11.19.1'
      - run: npm ci
      - run: node scripts/test-native-r2.mjs --local-sandbox
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm ci
      - name: Installed dependency advisories must be clear
        run: npm audit --audit-level=low
      # Release evidence additionally requires an independently inspected
      # installed/embedded/runtime inventory. npm audit alone does not prove it.
  release-evidence:
    if: github.event_name == 'workflow_dispatch' && inputs.evidence_path != ''
    needs: [source, dependencies, native-source, local-sandbox]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm ci
      - name: Verify actual evidence without publishing
        env:
          RELEASE_EVIDENCE_PATH: ${{ inputs.evidence_path }}
        run: node scripts/verify-release.mjs --round R1 --evidence "$RELEASE_EVIDENCE_PATH"
